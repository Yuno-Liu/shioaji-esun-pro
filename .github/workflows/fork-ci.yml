# fork 專屬 CI（玉山橋接、部署工具與 Docker 映像）。
# 不修改上游 workflow；上游 ci.yml 只在 pull_request 觸發，也不涵蓋 server/ 與 Docker。
name: fork-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Bridge & deploy tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bridge dependencies and E.Sun SDK (SHA256 verified)
        run: |
          python -m pip install --no-cache-dir -r deploy/requirements-esun-bridge.txt
          python deploy/install_sdk.py

      - name: Deploy tooling tests (install_sdk, deploy scripts)
        run: python -m unittest discover -s deploy -p 'test_*.py' -v

      - name: E.Sun bridge tests
        run: python -m unittest server.test_esun_trade_server -v

  docker:
    name: Docker images & nginx config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build esun-bridge image
        run: docker build --target esun-bridge -t shioaji-pro-esun-bridge:ci .

      - name: Build shioaji image
        run: docker build --target shioaji -t shioaji-pro-sinopac:ci .

      - name: Build web (nginx) image
        run: docker build --target runner -t shioaji-pro-web:ci .

      - name: nginx -t with rendered template
        run: |
          docker run --rm \
            -e SHIOAJI_API_UPSTREAM=http://127.0.0.1:21322 \
            -e ESUN_BRIDGE_TOKEN=ci-token \
            -e WEB_SERVER_NAMES="trade.example 192.0.2.10" \
            shioaji-pro-web:ci nginx -t

      - name: Bridge image runs as non-root with SDK importable
        run: |
          test "$(docker run --rm --network none shioaji-pro-esun-bridge:ci id -u)" = "10001"
          docker run --rm --network none shioaji-pro-esun-bridge:ci \
            python -c "from esun_trade.sdk import SDK; print('E.Sun SDK OK')"
