# 共用安全標頭（防點擊劫持、MIME 嗅探、Referer 外洩、停用用不到的裝置權限、ts.net 強制 HTTPS）。
# nginx 的 add_header 只要 location 內自己有 add_header 就不再繼承外層，
# 所以每個含 add_header 的 location 都要再 include 一次這個檔案。
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
# 不可加 screen-wake-lock：手機版的螢幕常亮（src/mobile/lib/wake-lock.ts）要用
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# $shioaji_pro_hsts 由 nginx.conf.template 的 map 決定：只有 *.ts.net（Tailscale HTTPS）才有值，
# 其他主機（localhost、區網 http://trade.lan:8080）為空字串，nginx 不送出此標頭
add_header Strict-Transport-Security $shioaji_pro_hsts always;
