# Shioaji Pro Web — Docker Compose（詳細說明見 docs/fork/esun.md）
#
# 安全預設：
# - web 只綁 127.0.0.1（WEB_BIND），esun-bridge 不發佈任何埠到主機（只在 compose 內網 expose）。
# - nginx 只接受 localhost / 127.0.0.1 / WEB_SERVER_NAMES 的 Host，並把 ESUN_BRIDGE_TOKEN
#   注入 /esun/ 請求；橋接要求此 token，瀏覽器不持有。
# - 專案目錄以唯讀掛載給橋接（ESUN_CONFIG_HOST_DIR，預設 .），登入熔斷狀態存於具名 volume。
# 需要區網存取時，請設定 WEB_BIND、WEB_SERVER_NAMES 並啟用 WEB_BASIC_AUTH，切勿直接開放 8080/8090。

# 容器日誌輪替（json-file，每檔 10 MB、保留 3 檔）：只套用在 web 與永豐 sidecar。
# esun-bridge 刻意不加：改它的 compose 設定會讓下一次 docker compose up 重建連著玉山正式環境的 bridge，
# 等下次收盤後要重建 bridge 時再一起加上 logging: *default-logging。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  shioaji-pro-web:
    container_name: shioaji-pro-web
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # 建置版本標籤（畫面上的「dev · <commit>」與映像 org.opencontainers.image.revision）；
        # scripts/deploy-docker.* 在建置前以 git rev-parse --short HEAD 設定
        GIT_REVISION: ${GIT_REVISION:-unknown}
    # always：Docker Desktop 或主機重啟後自動啟動。unless-stopped 在 Docker Desktop 正常關閉（會先停容器）後不會再啟動：
    # 2026-11-13 主機重開機與 Docker Desktop 重啟各一次，整組都停著直到手動啟動。
    restart: always
    logging: *default-logging
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      - SHIOAJI_API_UPSTREAM=${SHIOAJI_API_UPSTREAM:-http://127.0.0.1:21322}
      - ESUN_BRIDGE_UPSTREAM=${ESUN_BRIDGE_UPSTREAM:-http://esun-bridge:8090}
      - ESUN_BRIDGE_TOKEN=${ESUN_BRIDGE_TOKEN:-}
      - WEB_SERVER_NAMES=${WEB_SERVER_NAMES:-}
      - WEB_BASIC_AUTH=${WEB_BASIC_AUTH:-off}
      # NGINX_ENVSUBST_FILTER 由 Dockerfile 的 runner stage 統一定義
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 刻意不設 depends_on: esun-bridge：nginx 以 resolver 在執行期解析 esun-bridge，橋接未啟動或不健康時
    # web 仍可運作（/esun/ 回 502）。有這個相依時，`docker compose up -d shioaji-pro-web shioaji-server`
    # 會連帶啟動被刻意停掉的 bridge（例如盤中只重建 web、或改用宿主機橋接時）。

  shioaji-server:
    container_name: shioaji-pro-sinopac
    build:
      context: .
      dockerfile: Dockerfile
      target: shioaji
    # 與 web 同一個策略：共用 web 的網路命名空間，只有一邊自動啟動會留下半套服務（/api 回 502）。
    # 同版本引擎的巢狀 daemon 實測：always 在 8 次 daemon 重啟後兩個容器都自動回復。
    restart: always
    logging: *default-logging
    init: true
    # 共用 web 的網路命名空間：永豐 sidecar 只綁 127.0.0.1，nginx 以 loopback 存取
    network_mode: "service:shioaji-pro-web"
    depends_on:
      shioaji-pro-web:
        condition: service_started
        # web 被重建或重啟時一併重啟，重新加入新的網路命名空間
        restart: true
    environment:
      - SJ_HTTP_ADDR=127.0.0.1:21322
      - SJ_API_KEY=${SJ_API_KEY:-}
      - SJ_SEC_KEY=${SJ_SEC_KEY:-}
      - SJ_PRODUCTION=${SJ_PRODUCTION:-false}
      - SJ_CA_PATH=${SJ_CA_PATH:-}
      - SJ_CA_PASSWD=${SJ_CA_PASSWD:-}
      # 與上游桌面版相同：關閉逐筆請求日誌，避免容器日誌無限成長
      - SJ_HTTP_LOG=false
      - RUST_LOG=${SJ_RUST_LOG:-warn}
    volumes:
      - ./certs:/app/certs:ro
    healthcheck:
      # 未設定金鑰時只會 sleep，回報 unhealthy 才不會讓人誤以為行情正常。
      # 同時檢查 web 的 /healthz（免 Basic Auth；Host 127.0.0.1 一定在白名單）：兩者共用網路命名空間，
      # web 單獨重啟或重建時 sidecar 會卡在舊的命名空間、nginx 連不到它，這時也回報 unhealthy。
      # 恢復：docker compose up -d --no-deps --force-recreate shioaji-server（只動 sidecar；說明見 docs/fork/esun.md）
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:21322/api/v1/info > /dev/null && curl -sf http://127.0.0.1:${PORT:-8080}/healthz > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    command: >
      sh -c 'if [ -z "$$SJ_API_KEY" ] || [ -z "$$SJ_SEC_KEY" ]; then
        echo "[shioaji-server] 尚未設定 SJ_API_KEY / SJ_SEC_KEY，請於專案根目錄 .env 填寫永豐 API 金鑰後執行 docker compose up -d";
         exec sleep infinity;
      fi;
      exec shioaji server start --no-open'

  esun-bridge:
    container_name: shioaji-pro-esun-bridge
    build:
      context: .
      dockerfile: Dockerfile
      target: esun-bridge
    # 刻意維持 unless-stopped：bridge 一啟動就登入玉山，Docker 重啟後要不要啟動由使用者決定
    # （docker compose up -d esun-bridge）。前端在 bridge 恢復後會自動重新探測。
    restart: unless-stopped
    init: true
    # SIGTERM 後橋接最多等 8 秒讓進行中的委託完成並回應，再關閉 WebSocket／SSE；預設 10 秒不夠
    stop_grace_period: 15s
    # 不發佈到主機；排錯請用 docker compose exec esun-bridge curl -s localhost:8090/esun/livez
    expose:
      - "8090"
    environment:
      - ESUN_SERVER_HOST=0.0.0.0
      - ESUN_SERVER_PORT=8090
      - ESUN_CONFIG_DIR=/app/host-config
      - ESUN_STATE_DIR=/app/state
      - ESUN_BRIDGE_TOKEN=${ESUN_BRIDGE_TOKEN:-}
      - ESUN_ALLOWED_HOSTS=${WEB_SERVER_NAMES:-}
      - ESUN_ACCOUNT_PASSWORD=${ESUN_ACCOUNT_PASSWORD:-}
      - ESUN_PASSWORD=${ESUN_PASSWORD:-}
      - ESUN_CERT_PASSWORD=${ESUN_CERT_PASSWORD:-}
    volumes:
      # 設定檔目錄（預設專案根目錄）唯讀掛載；[Cert] Path 的相對路徑以此目錄為基準，
      # 因此既有的 certs/esun_cert.p12 不需搬移
      - ${ESUN_CONFIG_HOST_DIR:-.}:/app/host-config:ro
      - ./certs:/app/certs:ro
      - esun-state:/app/state
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512

volumes:
  esun-state:
